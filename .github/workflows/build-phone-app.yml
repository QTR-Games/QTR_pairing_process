# Build the phone app and keep it downloadable, without publishing anything.
#
# This is the normal path. The APK and the built web bundle are uploaded as
# workflow artifacts, downloadable from the Actions tab by anyone with access to
# the repository. To put the app on a phone: download the artifact, unzip it,
# copy qtr-pairing.apk to the device over USB, and tap it.
#
# This workflow used to deploy to GitHub Pages. It no longer does, because the
# app is not stable enough to be publicly usable yet and this repository is
# public, so anything Pages served was reachable by anyone who found the URL.
# That capability still exists in deploy-webapp.yml, which is manual-dispatch
# only and is kept as the event fallback.
#
# The installed APK is entirely offline. It bundles the web assets locally and
# sets no server.url, so it never makes a network request at runtime. Venue
# wifi cannot affect it.
#
# This also replaces the old android.yml, which built the same debug APK a
# second time on every push to main and could not survive the native project
# being committed -- it ran `cap add android`, which exits 1 when android/
# already exists. Rather than keep two workflows building one artifact, the
# pull_request trigger moved here, so a broken phone build still blocks a merge.
name: build-phone-app

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/build-phone-app.yml'
  pull_request:
    paths:
      - 'webapp/**'
      - '.github/workflows/build-phone-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a build midway; let a run finish before the next starts. Scoped
# per ref, or every open pull request would queue behind every other one.
concurrency:
  group: build-phone-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Capacitor 8 compiles its Android library at source level 21; JDK 17
      # gets as far as javac and then fails with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci
        working-directory: webapp

      # vite.config.ts sets base to './', so the bundle resolves from any path,
      # including the local filesystem and the Capacitor WebView origin.
      - run: npm run build
        working-directory: webapp

      # Order matters below. `cap sync` copies dist/ into the native project, so
      # the APK has to be built before anything is added to dist -- otherwise
      # the next run would package the previous APK inside the new one.
      #
      # The native project is committed now, so there is no `cap add` step. What
      # `cap sync` regenerates -- capacitor.build.gradle,
      # capacitor-cordova-android-plugins/ and the assets config -- stays
      # gitignored and is absent on a fresh checkout, so its directories have to
      # exist before sync runs.
      - name: Copy the bundle into the native project
        working-directory: webapp
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res/xml
          npx cap sync android

      - name: Assemble the APK
        working-directory: webapp/android
        # Every debug build gets a distinct, increasing versionCode. Without
        # this, each APK is versionCode 1, and a phone that already has an
        # earlier build refuses the install rather than upgrading it. The run
        # number is monotonic per repository, so it never regresses.
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.debug.${{ github.run_number }}
        # Maven Central has failed this build twice for reasons unrelated to the
        # code: a 429 under load, then a sustained 403 that outlasted a flat
        # three-attempt, 30s retry. Backing off doubles the wait, so five
        # attempts ride out roughly eight minutes rather than ninety seconds.
        run: |
          delay=30
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "::warning::APK build attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
          exit 1

      # Two names for one file. The stable one is what gets copied to a phone;
      # the sha-stamped one lets someone say which build they are running when
      # something looks wrong.
      - name: Collect the APK
        working-directory: webapp
        env:
          # On a pull_request event GITHUB_SHA is the throwaway merge commit,
          # which names the file after something that does not exist in history.
          # Use the real head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          src=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifact
          cp "$src" artifact/qtr-pairing.apk
          cp "$src" "artifact/qtr-pairing-${SHA:0:7}.apk"
          ls -lh artifact/*.apk

      # Read the version back out of the finished APK rather than trusting that
      # Gradle applied what it was given. A wrong versionCode is invisible until
      # a phone refuses the install with an unexplained "App not installed", so
      # it is worth one second here to assert it. Failing loudly is correct:
      # an APK stuck at versionCode 1 cannot be installed over an earlier build,
      # which makes it useless for the thing this workflow exists to do.
      - name: Verify the APK version
        working-directory: webapp
        env:
          EXPECTED: ${{ github.run_number }}
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          badging=$("$aapt2" dump badging artifact/qtr-pairing.apk | head -1)
          echo "$badging"
          actual=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::APK versionCode is '$actual', expected '$EXPECTED'." \
                 "An APK that does not advance its versionCode cannot be installed" \
                 "over an earlier build. See docs/android-build.md."
            exit 1
          fi
          echo "versionCode $actual — installs over any earlier build."

      - uses: actions/upload-artifact@v4
        with:
          name: qtr-pairing-apk
          path: webapp/artifact/*.apk
          if-no-files-found: error

      # The web bundle, for running the app locally on a PC without a toolchain:
      # unzip it and serve the folder with any static file server.
      - uses: actions/upload-artifact@v4
        with:
          name: qtr-pairing-web
          path: webapp/dist
          if-no-files-found: error
