name: tests

# Core test gate. Runs the pytest suite on every PR and on pushes to main.
# - Linux jobs run under Xvfb (a virtual display) so the Tk-dependent tests
#   actually execute instead of skipping.
# - The Windows job runs the full suite on the product's real platform (Tk is
#   native there, no display server needed).
# - A fresh --basetemp avoids pytest's shared per-user temp cleanup bug on Windows
#   (WinError 5 on pytest-current), which is infrastructure noise, not a test failure.
# The final `tests` job is a required status check, enforced by the `protect-main`
# ruleset along with `skills-schema`. That ruleset only applies while the
# repository is public: on the GitHub Free plan, rulesets and required status
# checks are unavailable for private repositories, and going private silently
# stops them being enforced rather than reporting an error. If this repository is
# ever made private again, re-check that protection is still in force instead of
# assuming it survived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Install Xvfb (virtual display for Tk tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run test suite under a virtual display
        run: xvfb-run -a python -m pytest -q --basetemp="${{ runner.temp }}/pt"

  windows:
    name: windows (py3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite (native Tk)
        run: python -m pytest -q --basetemp="${{ runner.temp }}\pt"

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: [linux, windows]
    if: always()
    steps:
      - name: Require all test jobs to pass
        run: |
          if [ "${{ needs.linux.result }}" != "success" ] || [ "${{ needs.windows.result }}" != "success" ]; then
            echo "linux=${{ needs.linux.result }} windows=${{ needs.windows.result }}"
            echo "One or more test jobs did not succeed."
            exit 1
          fi
          echo "All test jobs passed."
