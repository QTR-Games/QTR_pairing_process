name: skills-schema

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills-schema:
    name: skills-schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Validate skill schema
        run: python skill_schema_check.py --github

      - name: Test schema checker
        run: python -m pytest test_skill_schema_check.py -q
