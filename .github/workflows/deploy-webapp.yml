# Publish the phone app -- both ways of getting it.
#
# The point of this workflow is distribution. Teammates open one URL with
# signal, and from there either add the page to their home screen or download
# the APK; both work offline afterwards.
#
# The APK used to ship from a rolling `phone-latest` GitHub release. That does
# not work here: this repository has immutable releases enabled, so a tag that
# has been used once can never be reused. The old workflow deleted the release
# and then re-created it, which meant the first failure destroyed the team's
# only download link and could not put it back. That is what happened on #52.
#
# Pages has no tags and no rulesets, so the same URL can be overwritten forever:
#
#   https://qtr-games.github.io/QTR_pairing_process/qtr-pairing.apk
name: deploy-webapp

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; let a run finish before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Capacitor 8 compiles its Android library at source level 21; JDK 17
      # gets as far as javac and then fails with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: npm ci
        working-directory: webapp

      # vite.config.ts sets base to './', so the bundle resolves correctly from
      # the /QTR_pairing_process/ subpath Pages serves it from.
      - run: npm run build
        working-directory: webapp

      # Order matters below. `cap sync` copies dist/ into the native project, so
      # the APK has to be built before anything is added to dist -- otherwise
      # the next run would package the previous APK inside the new one.
      - name: Generate the native project
        run: npx cap add android
        working-directory: webapp

      - name: Copy the bundle into it
        run: npx cap sync android
        working-directory: webapp

      - name: Assemble the APK
        id: apk
        continue-on-error: true
        working-directory: webapp/android
        # Maven Central returns 429 under load and it has already broken a build
        # here. Three attempts with a pause clears the transient case. This step
        # is allowed to fail outright because the web app must still ship -- see
        # the fallback below.
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            echo "::warning::APK build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

      # Two names for one file. The stable one is what gets shared and what the
      # in-app link points at; the sha-stamped one lets someone say which build
      # they are actually running when something looks wrong.
      #
      # If the APK could not be built, fall back to the copy already live on the
      # site. A Pages deploy replaces the whole site, so doing nothing here would
      # delete the installer and break the download link for everyone -- over a
      # transient dependency mirror error. A stale APK beats a missing one, and
      # the web app ships either way.
      - name: Put the APK in the site
        working-directory: webapp
        run: |
          src=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$src" ]; then
            echo "::warning::APK build failed; keeping the one already published"
            live=https://qtr-games.github.io/QTR_pairing_process/qtr-pairing.apk
            if curl -fsSL "$live" -o dist/qtr-pairing.apk; then
              cp dist/qtr-pairing.apk "dist/qtr-pairing-${GITHUB_SHA:0:7}.apk"
              ls -lh dist/*.apk
              exit 0
            fi
            echo "no APK built and none published to fall back to"
            exit 1
          fi
          cp "$src" dist/qtr-pairing.apk
          cp "$src" "dist/qtr-pairing-${GITHUB_SHA:0:7}.apk"
          ls -lh dist/*.apk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

      - id: deployment
        uses: actions/deploy-pages@v4
