# Builds the phone app.
#
# The APK is a wrapper around the exact `dist` that ships to GitHub Pages, so
# the phone and the laptop cannot disagree about a number. Nothing native is
# committed: `cap add android` regenerates the Gradle project on every run,
# because a checked-in Android project is a second thing to keep current and it
# drifts the moment Capacitor updates.
#
# Debug signing only. This installs by sideload for one team, and a release key
# would have to live in secrets to buy nothing they need.
name: android

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Capacitor 8 compiles its Android library at source level 21; JDK 17
      # gets as far as javac and then fails with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Generate the native project
        run: npx cap add android

      - name: Copy the bundle into it
        run: npx cap sync android

      - name: Assemble the APK
        working-directory: webapp/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it after the commit
        id: name
        env:
          # On a pull_request event GITHUB_SHA is the throwaway merge commit,
          # which names the file after something that does not exist in
          # history. Use the real head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          src=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$src" || { echo "no APK at $src"; exit 1; }
          out="qtr-pairing-${SHA:0:7}.apk"
          cp "$src" "$out"
          echo "path=webapp/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # An Actions artifact is a login-gated zip, which is a poor way to get an
      # app onto a teammate's phone. A release asset is a plain .apk on a URL a
      # phone browser can open directly, so main publishes one and keeps the
      # tag rolling.
      - name: Publish it somewhere a phone can reach
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.name.outputs.sha }}
          APK: ${{ steps.name.outputs.name }}
        run: |
          cat > notes.md <<NOTES
          Built from $SHA.

          **Android, sideload.** Download the .apk below on the phone and open
          it. Android asks once for permission to install from this browser.

          Debug-signed, so it will not update over a copy installed from a
          different source -- uninstall the old one first if it refuses.

          Everything stays on the device: no account, no sync, and it works
          with no signal.

          If you would rather not sideload, the same build runs in a browser at
          https://qtr-games.github.io/QTR_pairing_process/ and can be added to
          the home screen from there.
          NOTES
          gh release delete phone-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create phone-latest "$APK" \
            --title "QTR Pairing -- phone build" \
            --prerelease \
            --notes-file notes.md
