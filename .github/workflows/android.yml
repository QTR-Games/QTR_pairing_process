# Builds the phone app.
#
# The APK is a wrapper around the exact `dist` that ships to GitHub Pages, so
# the phone and the laptop cannot disagree about a number. Nothing native is
# committed: `cap add android` regenerates the Gradle project on every run,
# because a checked-in Android project is a second thing to keep current and it
# drifts the moment Capacitor updates.
#
# Debug signing only. This installs by sideload for one team, and a release key
# would have to live in secrets to buy nothing they need.
name: android

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Capacitor 8 compiles its Android library at source level 21; JDK 17
      # gets as far as javac and then fails with "invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build the web bundle
        run: npm run build

      - name: Generate the native project
        run: npx cap add android

      - name: Copy the bundle into it
        run: npx cap sync android

      - name: Assemble the APK
        working-directory: webapp/android
        # Maven Central has now failed this job twice for reasons that have
        # nothing to do with the code: a 429 under load, then a sustained 403.
        # Both cleared on a later run. The first version of this retried three
        # times with a flat 30s pause, which covers about a minute and a half --
        # and the 403 outlasted it, failing all three attempts inside five
        # seconds each. Backing off doubles the wait each time, so five attempts
        # ride out roughly eight minutes instead.
        #
        # Unlike the deploy workflow this one is still allowed to fail hard: it
        # exists to tell you the APK is broken before it is merged.
        run: |
          delay=30
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "::warning::APK build attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
          exit 1

      - name: Name it after the commit
        id: name
        env:
          # On a pull_request event GITHUB_SHA is the throwaway merge commit,
          # which names the file after something that does not exist in
          # history. Use the real head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          src=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$src" || { echo "no APK at $src"; exit 1; }
          out="qtr-pairing-${SHA:0:7}.apk"
          cp "$src" "$out"
          echo "path=webapp/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # This workflow no longer publishes anything. It used to roll a
      # `phone-latest` release tag, which is incompatible with the immutable
      # releases this repository has enabled: `gh release delete --cleanup-tag`
      # removed the old release, and the `create` that followed failed with
      # "tag_name was used by an immutable release". Because the delete ran
      # first, the failing run destroyed the team's only download link and
      # could not put it back -- which is what happened on #52.
      #
      # Nothing is published anywhere now. GitHub Pages was switched off on
      # purpose: this repository is public, and the app is not stable enough to
      # be publicly usable yet. build-phone-app.yml uploads the APK as a
      # workflow artifact instead, downloadable from the Actions tab.
      #
      # What is left here is the check that the phone build still compiles, on
      # every pull request, before it can reach main.