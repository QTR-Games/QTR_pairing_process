# Build a signed, installable release APK.
#
# This is the deliberate path, separate from build-phone-app.yml. That workflow
# runs on every push to main and produces a *debug* APK, which is fine for a
# quick look but is signed with a throwaway debug key. This one produces a
# release APK signed with the project's own key, which is what you want on a
# phone you are going to rely on at an event: it can be upgraded in place across
# builds without uninstalling, and it is the same identity every time.
#
# Manual dispatch is the normal path. Pushing a v* tag builds the same artifact
# for a tagged version.
#
# Signing material never lives in the repository. It comes from four repository
# secrets, published by scripts/Publish-SigningSecrets.ps1. See
# docs/android-build.md for the full setup.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to testers (e.g. 1.2.0)'
        required: true
        type: string
      version_code:
        description: 'Version code -- must be higher than the last build you installed'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21 is mandatory: Capacitor 8 pins VERSION_21, and JDK 17 fails at
      # :capacitor-android:compileDebugJavaWithJavac with "invalid source
      # release: 21". Temurin is also mandatory -- Oracle's 21.0.9 wedges
      # forever in D8 at :app:mergeProjectDexDebug, which reads as a slow build
      # rather than a broken one. See docs/android-build.md.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8's CLI refuses to run below 22.
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - uses: android-actions/setup-android@v3

      - run: npm ci
        working-directory: webapp

      - run: npm run build
        working-directory: webapp

      # capacitor.build.gradle, capacitor-cordova-android-plugins/ and the
      # assets config are generated by cap sync and gitignored, so they are
      # absent on a fresh checkout. Their directories must exist first.
      - name: Copy the bundle into the native project
        working-directory: webapp
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res/xml
          npx cap sync android

      # A tag push carries no dispatch inputs. Fall back to the tag name for the
      # version and the run number for the version code, which is monotonic per
      # repository and so never regresses.
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "code=${{ inputs.version_code }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Fail loudly and early rather than silently emitting an unsigned apk that
      # no phone will install. build.gradle only warns, because PR CI must still
      # be able to assemble without any signing material. All four secrets are
      # checked: a missing password or alias would otherwise surface much later
      # as an obscure Gradle or apksigner failure.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing ANDROID_$name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing. Run scripts/Publish-SigningSecrets.ps1."
            exit 1
          fi

      # The keystore is written outside the workspace so it cannot be picked up
      # by a later step, and the runner is destroyed after the job.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        working-directory: webapp/android
        timeout-minutes: 30
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        # Same Maven Central backoff as build-phone-app.yml, for the same
        # reason: the dependency host has failed this build twice for reasons
        # unrelated to the code.
        run: |
          delay=30
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then break; fi
            echo "::warning::APK build attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
          exit 1

      # Proof rather than assumption: an unsigned apk is the failure this whole
      # workflow exists to prevent, so verify the signature before publishing.
      - name: Verify the APK is signed
        run: |
          APK=webapp/android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # Named with both version and code so a tester can say exactly which build
      # they are running when something looks wrong.
      - name: Collect the APK
        working-directory: webapp
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifact/klikklak-${{ steps.version.outputs.name }}.apk"
          ls -lh artifact/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: klikklak-release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: webapp/artifact/*.apk
          if-no-files-found: error
          retention-days: 90
