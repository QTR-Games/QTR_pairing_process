name: lint

# Static analysis for QTR Pairing Process.
#
# Phase-in policy: this workflow starts in WARN mode - ruff and mypy run and print
# findings, but do NOT fail the build (continue-on-error: true). This lets the team see
# the real backlog on an established codebase without blocking every PR on day one.
#
# Promotion to blocking: once the existing findings are triaged/cleared, flip the two
# `continue-on-error: true` lines to `false` (or remove them) and add `lint` to the
# branch ruleset's required status checks. Until then, do NOT make this a required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (warn)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: ruff check (non-blocking during phase-in)
        continue-on-error: true
        run: ruff check --output-format=github .

  mypy:
    name: mypy (warn)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install mypy + runtime deps
        run: |
          python -m pip install --upgrade pip mypy
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: mypy (non-blocking during phase-in)
        continue-on-error: true
        run: mypy qtr_pairing_process
