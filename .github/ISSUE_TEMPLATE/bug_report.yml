name: Bug report
description: Something in the pairing app is broken or behaving incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please include enough detail to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong? What did you expect instead?
      placeholder: When I import the matchup XLSX, the decision tree renders empty...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the exact file/import path or data shape if relevant.
      placeholder: |
        1. Launch with `python main.py`
        2. Import teams.csv
        3. Open the matchup grid...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app?
      options:
        - Matchup grid / data model
        - Pairing decision tree
        - CSV/XLSX import or export
        - Database / persistence (SQLite)
        - UI / Tkinter window
        - Settings
        - Packaging / release build
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From the About screen or the VERSION file (e.g. 2.1.4).
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version & OS
      placeholder: Python 3.12 on Windows 11
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste from `qtr_pairing_process.log` if available. This is rendered as code, no backticks needed.
      render: text
    validations:
      required: false
