apply plugin: 'com.android.application'

// Release signing material is resolved from webapp/android/keystore.properties
// for local builds, or from ANDROID_KEYSTORE_* environment variables in CI.
// Both are gitignored or held as repository secrets — no keystore, password or
// path is ever committed. When neither source is present the release build
// stays unsigned instead of failing, so PR CI and a fresh clone can still
// assemble. See docs/android-build.md.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingSetting = { String key, String envName ->
    def value = System.getenv(envName) ?: keystoreProperties.getProperty(key)
    return value?.trim() ? value.trim() : null
}

def releaseStoreFile = signingSetting('storeFile', 'ANDROID_KEYSTORE_FILE')
def releaseStorePassword = signingSetting('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingSetting('keyAlias', 'ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingSetting('keyPassword', 'ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (!hasReleaseSigning) {
    logger.lifecycle('No release signing configured; assembleRelease will produce an UNSIGNED apk. See docs/android-build.md.')
}

// versionCode must increase for every build a tester installs over an earlier
// one, otherwise Android rejects the install with INSTALL_FAILED_VERSION_DOWNGRADE
// and the sideload silently fails. CI overrides it per release; the values in
// android/gradle.properties are the local-build fallback.
def resolvedVersionCode = (System.getenv('ANDROID_VERSION_CODE')
    ?: project.findProperty('qtrVersionCode') ?: '1') as Integer
def resolvedVersionName = System.getenv('ANDROID_VERSION_NAME')
    ?: project.findProperty('qtrVersionName') ?: '1.0'

// State it in the build output. A wrong versionCode does not fail the build --
// it fails the install, hours later, on a phone, as an unexplained "App not
// installed". Printing it here is the only cheap place to catch that.
println "QTR: building versionCode ${resolvedVersionCode}, versionName ${resolvedVersionName}"

android {
    namespace = "com.gronksoft.klikklak"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.gronksoft.klikklak"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
