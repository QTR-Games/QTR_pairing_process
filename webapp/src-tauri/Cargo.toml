[package]
name = "klik-klak"
version = "0.1.0"
description = "KLIK KLAK — QTR 5v5 tournament pairing planner (desktop shell)"
authors = ["QTR Games"]
license = "MIT"
repository = "https://github.com/QTR-Games/QTR_pairing_process"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# Lets the Longshanks import run on desktop. The webview cannot fetch
# longshanks.org itself -- the site sends no CORS headers -- so the request is
# made from Rust, where the browser's origin rules do not apply. The phone build
# solves the same problem with Capacitor's native HTTP client.
tauri-plugin-http = "2"

# Auto-update is desktop-only: mobile ships through app stores, and the updater
# crate declares no Android/iOS support. The target gate keeps it (and the
# process plugin it uses to relaunch) out of any mobile build.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
